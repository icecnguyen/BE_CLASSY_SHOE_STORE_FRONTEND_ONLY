<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách sản phẩm — BE CLASSY</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body data-page="products">
  <div id="site-header-mount"></div>

  <main class="container">
    <nav class="breadcrumb">
      <a href="index.html">Trang chủ</a>
      <span class="sep">/</span>
      <span class="text-main font-medium">Danh sách sản phẩm</span>
    </nav>

    <div class="catalog-header">
      <span class="eyebrow">Bộ sưu tập giày da BE CLASSY</span>
      <h1 class="serif-heading" style="font-size:2.25rem;margin-top:4px;">Tất cả thiết kế</h1>
    </div>

    <div class="catalog-layout">
      <!-- Bộ lọc sản phẩm -->
      <aside class="filter-sidebar">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <strong style="font-size:0.9rem;">Bộ lọc tìm kiếm</strong>
          <button type="button" class="text-accent" style="font-size:0.78rem;text-decoration:underline;" id="btn-clear-filters">Đặt lại</button>
        </div>

        <div class="filter-group">
          <div class="filter-title">Danh mục loại giày</div>
          <div class="filter-check-list" id="filter-categories"></div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Thương hiệu</div>
          <div class="filter-check-list" id="filter-brands"></div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Mức giá</div>
          <div class="filter-check-list">
            <label class="filter-check-item">
              <input type="radio" name="priceRange" value="all" checked>
              <span>Tất cả mức giá</span>
            </label>
            <label class="filter-check-item">
              <input type="radio" name="priceRange" value="under2m">
              <span>Dưới 2.000.000₫</span>
            </label>
            <label class="filter-check-item">
              <input type="radio" name="priceRange" value="2mto25m">
              <span>2.000.000₫ – 2.500.000₫</span>
            </label>
            <label class="filter-check-item">
              <input type="radio" name="priceRange" value="over25m">
              <span>Trên 2.500.000₫</span>
            </label>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Kích cỡ còn hàng</div>
          <div class="size-filter-grid" id="filter-sizes"></div>
        </div>

        <div class="filter-group">
          <div class="filter-title">Màu da</div>
          <select class="form-control" id="filter-color"></select>
        </div>
      </aside>

      <!-- Danh sách sản phẩm & Thanh công cụ -->
      <section>
        <div class="catalog-toolbar" id="search">
          <form class="catalog-search-box" id="catalog-search-form">
            <input type="text" class="form-control" id="catalog-search-input" placeholder="Tìm theo tên giày, mã SP, loại giày...">
            <button type="submit" class="btn btn-primary">Tìm</button>
          </form>

          <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
            <span class="text-muted" style="font-size:0.84rem;" id="catalog-result-count"></span>
            <select class="form-control" style="width:auto;" id="catalog-sort">
              <option value="default">Sắp xếp: Mặc định</option>
              <option value="price-asc">Giá: Thấp đến Cao</option>
              <option value="price-desc">Giá: Cao đến Thấp</option>
              <option value="name-asc">Tên: A → Z</option>
            </select>
          </div>
        </div>

        <div class="product-grid cols-3" id="catalog-products-grid"></div>
        <div class="pagination" id="catalog-pagination"></div>
      </section>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
